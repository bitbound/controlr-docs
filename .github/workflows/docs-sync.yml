on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'ControlR version tag to record (omit to use the latest release)'
        type: string
        required: false

name: Docs Version Sync

jobs:
  version-sync:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Sync ControlR version
        run: |
          CURRENT=$(cat .github/docs-sync-version.txt 2>/dev/null | tr -d '[:space:]')

          TARGET="${{ inputs.target_version }}"
          if [ -z "$TARGET" ]; then
            TARGET=$(curl -s https://api.github.com/repos/bitbound/ControlR/releases/latest | jq -r '.tag_name')
          fi

          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "Could not determine the latest ControlR version." >&2
            exit 1
          fi

          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Version file already reads $TARGET. Nothing to do."
            echo "## Skip" >> "$GITHUB_STEP_SUMMARY"
            echo "\`.github/docs-sync-version.txt\` already reads \`$TARGET\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "$TARGET" > .github/docs-sync-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/docs-sync-version.txt
          git commit -m "chore: sync ControlR version to $TARGET"
          git push

          echo "Synced $CURRENT -> $TARGET"
          echo "## Synced" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$CURRENT\` -> \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"
